<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>J.A.R.V.I.S.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="grid-bg" aria-hidden="true"></div>
  <div class="scanlines" aria-hidden="true"></div>

  <!-- top bar -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-name">J.A.R.V.I.S.</span>
      <span class="brand-sub">Just A Rather Very Intelligent System</span>
    </div>
    <ul class="chips" aria-label="Systemstatus">
      <li>Gehirn <b id="stBrain">—</b></li>
      <li>Stimme <b id="stVoice">—</b></li>
      <li>Web <b id="stWeb">—</b></li>
      <li>Cockpit <b id="stCockpit">—</b></li>
      <li>Mikro <b id="stMic">AUS</b></li>
    </ul>
  </header>

  <main class="hud">
    <!-- left column -->
    <section class="col col-left">
      <div class="panel" id="clockPanel">
        <div class="panel-title">Lokalzeit</div>
        <div id="clock" class="big-num">--:--</div>
        <div id="date" class="sub"></div>
      </div>

      <div class="panel grow">
        <div class="panel-title">Deine Aufgaben <span id="taskSource" class="title-note"></span></div>
        <ul id="tasks" class="task-list"><li class="muted">Lade …</li></ul>
      </div>

      <div class="panel" id="chatPanel" hidden>
        <div class="panel-title">Team-Chat</div>
        <ul id="chat" class="chat-list"></ul>
      </div>
    </section>

    <!-- center: reactor / face -->
    <section class="center">
      <button id="reactorBtn" class="reactor-btn" aria-label="Mikrofon an/aus">
        <canvas id="reactor" width="1200" height="1200"></canvas>
      </button>
      <div id="status" class="status">STANDBY</div>
      <div id="caption" class="caption" aria-live="polite"></div>
      <div id="you" class="you"></div>
      <form id="typeForm" class="type-form" autocomplete="off" hidden>
        <input id="typeInput" placeholder="Nachricht an Jarvis …">
        <button class="hud-btn" type="submit">SENDEN</button>
      </form>
    </section>

    <!-- right column -->
    <section class="col col-right">
      <div class="panel" id="weatherPanel">
        <div class="panel-title">Atmosphäre · <span id="wCity">—</span></div>
        <div class="weather-row">
          <div id="wTemp" class="big-num">--°</div>
          <div class="weather-meta">
            <div id="wDesc">—</div>
            <div id="wRange" class="sub"></div>
            <div id="wFeels" class="sub"></div>
          </div>
        </div>
      </div>

      <div class="panel grow">
        <div class="panel-title">Projekte <a id="cockpitLink" class="title-link" target="_blank" rel="noopener" hidden>Cockpit ↗</a></div>
        <ul id="projects" class="project-list"><li class="muted">Lade …</li></ul>
      </div>

      <div class="panel" id="kpiPanel" hidden>
        <div class="panel-title">BLYNK live</div>
        <div id="kpis" class="kpi-grid"></div>
      </div>
    </section>
  </main>

  <!-- dock -->
  <nav class="dock">
    <button id="typeBtn" class="dock-btn" title="Tippen statt sprechen">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M6 10h1M9 10h1M12 10h1M15 10h1M18 10h1M7 14h10"/></svg>
      <span>TIPPEN</span>
    </button>
    <button id="micBtn" class="mic-btn" title="Mikrofon an/aus (Leertaste)" aria-label="Mikrofon an/aus">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"/></svg>
    </button>
    <button id="stopBtn" class="dock-btn" title="Jarvis unterbrechen (Esc)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg>
      <span>STOPP</span>
    </button>
  </nav>

  <div id="warn" class="warn" hidden></div>

  <!-- boot sequence after the double clap -->
  <div id="boot" class="boot" hidden>
    <div class="boot-inner">
      <div class="boot-logo">J.A.R.V.I.S.</div>
      <pre id="bootLog" class="boot-log"></pre>
      <div class="boot-bar"><span id="bootBar"></span></div>
    </div>
  </div>

  <div id="unlock" class="unlock" hidden>
    <button id="unlockBtn" class="hud-btn big">KLICKEN, UM JARVIS ZU HÖREN</button>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
